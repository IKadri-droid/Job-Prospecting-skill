<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{full_name}} — CV</title>
<style>
  /* One column, real text, standard section titles: readable by people and by screening tools (ATS).
     No icons, no tables, no images. Fonts available everywhere. Fits A4 and US Letter. */
  @page { size: A4; margin: 14mm 16mm; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 10pt; line-height: 1.38;
         color: #1f2328; text-rendering: geometricPrecision; }
  h1 { font-size: 21pt; margin: 0; color: #12355b; letter-spacing: .2px; }
  .headline { font-size: 11.5pt; margin: 2px 0 6px; color: #12355b; font-style: italic; }
  .contact { font-size: 9.2pt; color: #4a5160; margin: 0 0 4px; }
  .summary p { margin: 6px 0 0; }
  h2 { font-size: 11.5pt; color: #12355b; margin: 12px 0 4px; padding-bottom: 2px; border-bottom: 1px solid #c9d1dc;
       text-transform: none; }
  p { margin: 3px 0; }
  ul { margin: 2px 0 6px; padding-left: 16px; }
  li { margin: 1px 0; }
  strong { font-weight: 600; color: #12355b; }
</style>
</head>
<body>
  <h1>{{full_name}}</h1>
  <p class="headline">{{headline}}</p>
  <p class="contact">{{contact_line}}</p>
  <div class="summary">{{{summary}}}</div>

  <!--section:skills--><h2>{{t_skills}}</h2>
  {{{skills}}}<!--/section:skills-->

  <!--section:experience--><h2>{{t_experience}}</h2>
  {{{experience}}}<!--/section:experience-->

  <!--section:projects--><h2>{{t_projects}}</h2>
  {{{projects}}}<!--/section:projects-->

  <!--section:education--><h2>{{t_education}}</h2>
  {{{education}}}<!--/section:education-->

  <!--section:certificates--><h2>{{t_certificates}}</h2>
  {{{certificates}}}<!--/section:certificates-->

  <!--section:languages--><h2>{{t_languages}}</h2>
  <p>{{languages}}</p><!--/section:languages-->

  <!--section:interests--><h2>{{t_interests}}</h2>
  <p>{{interests}}</p><!--/section:interests-->
</body>
</html>
