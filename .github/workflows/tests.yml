name: tests
on: [push, pull_request]
jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/test_scripts.py
      - run: python -c "import json; d = json.load(open('evals/evals.json', encoding='utf-8')); assert len(d['evals']) >= 10"
